<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>웹 턴제 대전 게임</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: #fff; padding: 20px; }
        .screen { display: none; }
        .active { display: block; }
        .box { background: #333; padding: 20px; border-radius: 10px; display: inline-block; margin: 10px; width: 350px; vertical-align: top; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; font-size: 16px; }
        input { padding: 10px; font-size: 16px; width: 200px; }
        .char-btn { background: #444; color: white; border: 2px solid #555; border-radius: 5px; }
        .char-btn.selected { border-color: #ffcc00; background: #665500; }
        .status-box { display: flex; justify-content: space-around; margin: 20px 0; }
        .player-panel { background: #444; padding: 15px; border-radius: 8px; width: 42%; text-align: left; }
        .player-panel h3 { text-align: center; margin-top: 0; }
        #log { background: #111; height: 140px; overflow-y: auto; text-align: left; padding: 10px; font-family: monospace; border-radius: 5px; font-size: 14px; }
    </style>
</head>
<body>

    <h1>🎮 웹 턴제 대전 게임</h1>

    <!-- 1. 캐릭터 선택 및 로비 화면 -->
    <div id="lobby-screen" class="screen active">
        <h2>1. 캐릭터를 선택하세요</h2>
        <button class="char-btn selected" onclick="selectCharacter(0)">마피아</button>
        <button class="char-btn" onclick="selectCharacter(1)">경찰</button>
        <button class="char-btn" onclick="selectCharacter(2)">의사</button>
        <br><br>
        <p>선택된 캐릭터 번호: <span id="my-choice-num" style="color: yellow; font-weight: bold;">0</span>번 (<span id="my-choice-name">전사</span>)</p>
        <hr style="width: 50%; border-color: #444; margin: 20px auto;">

        <div style="display: flex; justify-content: center; gap: 20px;">
            <div class="box">
                <h3>방 만들기 (방장)</h3>
                <button onclick="createRoom()">방 생성</button>
                <p>내 방 코드: <span id="my-id" style="color: #00ffcc;">-</span></p>
            </div>
            <div class="box">
                <h3>방 들어가기 (참가자)</h3>
                <input type="text" id="target-id" placeholder="친구 방 코드 입력"><br>
                <button onclick="joinRoom()">입장하기</button>
            </div>
        </div>
        <p id="wait-msg" style="color: #aaa; margin-top: 15px;"></p>
    </div>

    <!-- 2. 전투 화면 -->
    <div id="game-screen" class="screen">
        <div class="status-box">
            <!-- 내 정보 패널 -->
            <div class="player-panel" style="border: 2px solid #00ffcc;">
                <h3 id="p1-name">내 정보</h3>
                <p>❤️ 체력: <span id="p1-hp">100</span></p>
                <p>⚔️ 공격력: <span id="p1-atk">25</span></p>
                <p>✨ 회복량: <span id="p1-heal">20</span></p>
                <p>🛡️ 수비상태: <span id="p1-def" style="color: #ffcc00;">일반</span></p>
            </div>
            <!-- 상대 정보 패널 -->
            <div class="player-panel" style="border: 2px solid #ff4444;">
                <h3 id="p2-name">상대 정보</h3>
                <p>❤️ 체력: <span id="p2-hp">100</span></p>
                <p>⚔️ 공격력: <span id="p2-atk">25</span></p>
                <p>✨ 회복량: <span id="p2-heal">20</span></p>
                <p>🛡️ 수비상태: <span id="p2-def" style="color: #ffcc00;">일반</span></p>
            </div>
        </div>

        <h3 id="turn-indicator" style="color: #ffcc00;">내 턴입니다!</h3>
        
        <div id="action-buttons">
            <button onclick="sendAction('attack')" style="background: #d9534f; color: white;">⚔️ 공격</button>
            <button onclick="sendAction('defend')" style="background: #f0ad4e; color: white;">🛡️ 수비 (피해 50% 감소)</button>
            <button onclick="sendAction('heal')" style="background: #5cb85c; color: white;">✨ 회복</button>
        </div>

        <div style="width: 700px; margin: 20px auto;">
            <h4>전투 로그</h4>
            <div id="log"></div>
        </div>
    </div>

    <script>
        // 캐릭터 데이터 정의
        const characterDataList = [
            { name: '마피아', hp: 100, atk: 20, healPower: 0 },
            { name: '경찰', hp: 100, atk: 10, healPower: 5 },
            { name: '의사', hp: 100, atk: 10, healPower: 50 }
        ];

        let peer, conn;
        let isHost = false;
        
        let myCharacterId = 0;
        
        // 💡 플레이어마다 자유롭게 쓸 수 있는 변수 풀(pool 배열) 추가
        let myData = { 
            characterId: 0, 
            name: '전사', 
            hp: 120, 
            maxHp: 120, 
            atk: 25, 
            healPower: 20, 
            defing: false,
            pool: [] // 여기에 유동적으로 변수를 추가/수정하여 사용하세요
        };
        
        let enemyData = { 
            characterId: 0, 
            name: '', 
            hp: 100, 
            maxHp: 100, 
            atk: 25, 
            healPower: 20, 
            defing: false,
            pool: [] 
        };

        let myTurn = false;
        let enemyReady = false;
        let myReady = false;

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // 캐릭터 번호로 스탯 및 풀 세팅
        function selectCharacter(id) {
            myCharacterId = id;
            const info = characterDataList[id];

            myData.characterId = id;
            myData.name = info.name;
            myData.hp = info.hp;
            myData.maxHp = info.hp;
            myData.atk = info.atk;
            myData.healPower = info.healPower;
            
            // 예시: 캐릭터별 초기 풀(pool) 설정 (자유롭게 커스텀 가능)
            if (id === 0) {
                myData.pool = [5]; // n분의 1 확률로 실패
            } else if (id === 1) {
                myData.pool = [];   // 마법사 전용 풀 데이터 예시
            } else if (id === 2) {
                myData.pool = [];   // 힐러 전용 풀 데이터 예시
            }
            
            document.getElementById('my-choice-num').innerText = id;
            document.getElementById('my-choice-name').innerText = info.name;
            
            document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('selected'));
            event.target.classList.add('selected');
        }

        function createRoom() {
            isHost = true;
            peer = new Peer();
            peer.on('open', (id) => {
                document.getElementById('my-id').innerText = id;
                document.getElementById('wait-msg').innerText = '방 생성 완료! 코드를 공유하고 접속 대기 중...';
            });
            peer.on('connection', (c) => {
                conn = c;
                setupConnection();
                document.getElementById('wait-msg').innerText = '친구 접속 완료! 게임 시작!';
                setTimeout(() => {
                    conn.send({ type: 'READY', data: myData });
                    myReady = true;
                    checkGameStart();
                }, 500);
            });
        }

        function joinRoom() {
            isHost = false;
            const targetId = document.getElementById('target-id').value;
            if (!targetId) {
                alert('방 코드를 입력해주세요!');
                return;
            }
            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(targetId);
                setupConnection();
                conn.on('open', () => {
                    document.getElementById('wait-msg').innerText = '방 입장 성공! 데이터 동기화 중...';
                    conn.send({ type: 'READY', data: myData });
                    myReady = true;
                });
            });
        }

        function setupConnection() {
            conn.on('data', (packet) => {
                handlePacket(packet);
            });
        }

        function handlePacket(packet) {
            if (packet.type === 'READY') {
                enemyData = packet.data; // 상대방의 풀(pool)을 포함한 전체 데이터가 동기화됨
                enemyReady = true;
                
                if (!isHost && !myReady) {
                    conn.send({ type: 'READY', data: myData });
                    myReady = true;
                }
                checkGameStart();
            } else if (packet.type === 'ACTION') {
                processEnemyAction(packet.action);
            }
        }

        function checkGameStart() {
            if (myReady && enemyReady) {
                showScreen('game-screen');
                document.getElementById('p1-name').innerText = `${myData.name} (내 번호: ${myData.characterId})`;
                document.getElementById('p2-name').innerText = `${enemyData.name} (상대 번호: ${enemyData.characterId})`;
                
                document.getElementById('p1-atk').innerText = myData.atk;
                document.getElementById('p1-heal').innerText = myData.healPower;
                document.getElementById('p2-atk').innerText = enemyData.atk;
                document.getElementById('p2-heal').innerText = enemyData.healPower;

                updateUI();

                if (isHost) {
                    myTurn = true;
                    addLog('게임 시작! 당신의 선공입니다.');
                } else {
                    myTurn = false;
                    addLog('게임 시작! 상대방의 턴입니다.');
                }
                updateTurnUI();
            }
        }

        function sendAction(actionType) {
            if (!myTurn) return;

            executeAction(true, actionType);
            
            // 행동할 때 내 풀(pool) 상태도 함께 상대에게 전달됨
            conn.send({ type: 'ACTION', action: actionType, pool: myData.pool });

            myTurn = false;
            updateTurnUI();
        }

        function processEnemyAction(actionType) {
            executeAction(false, actionType);
            myTurn = true;
            updateTurnUI();
            addLog('내 턴이 돌아왔습니다!');
        }

        function executeAction(isMe, action) {
            let actor = isMe ? myData : enemyData;
            let target = isMe ? enemyData : myData;
            let actorName = actor.name;

            actor.defing = false;

            if (action === 'attack') {
                let damage = actor.atk;
                if (actor.characterId === 0){
                    if (Math.floor(Math.random() * (actor.pool[0] + 1)) !== actor.pool[0]){
                        actor.pool[0]--;
                        if (target.defing) {
                            damage = Math.floor(damage / 2);
                            addLog(`${actorName} 탕! 명중! 방어 중 효과 절반 ${damage} 피해.`);
                        } else {
                            addLog(`${actorName} 탕! 명중! ${damage} 피해.`);
                        }
                    } else {
                        damage = 0;
                        addLog(`${actorName} 탕! 그러나 물총!`);
                    }
                }
                
                target.hp = Math.max(0, target.hp - damage);
            } else if (action === 'defend') {
                actor.defing = true;
                addLog(`${actorName}이(가) 방어 태세! (다음 받는 피해 50% 감소)`);
            } else if (action === 'heal') {
                let healAmount = actor.healPower;
                actor.hp = Math.min(actor.maxHp, actor.hp + healAmount);
                addLog(`${actorName}이(가) 체력 ${healAmount} 회복.`);
            }

            updateUI();
            checkGameOver();
        }

        function updateUI() {
            document.getElementById('p1-hp').innerText = `${myData.hp} / ${myData.maxHp}`;
            document.getElementById('p1-def').innerText = myData.defing ? '🛡️ 수비 중 (피해 50% 감소)' : '일반';

            document.getElementById('p2-hp').innerText = `${enemyData.hp} / ${enemyData.maxHp}`;
            document.getElementById('p2-def').innerText = enemyData.defing ? '🛡️ 수비 중 (피해 50% 감소)' : '일반';
        }

        function updateTurnUI() {
            const indicator = document.getElementById('turn-indicator');
            const buttons = document.getElementById('action-buttons');
            if (myTurn) {
                indicator.innerText = "⚡ 내 턴입니다! 행동을 선택하세요.";
                indicator.style.color = "#00ffcc";
                buttons.style.display = "block";
            } else {
                indicator.innerText = "⏳ 상대방의 턴입니다... 기다려주세요.";
                indicator.style.color = "#ff4444";
                buttons.style.display = "none";
            }
        }

        function checkGameOver() {
            if (myData.hp <= 0) {
                alert('패배했습니다...');
                location.reload();
            } else if (enemyData.hp <= 0) {
                alert('승리했습니다!');
                location.reload();
            }
        }

        function addLog(text) {
            const logBox = document.getElementById('log');
            logBox.innerHTML += `<div>> ${text}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }
    </script>
</body>
</html>
